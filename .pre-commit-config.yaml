repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.1
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies:
          - types-pyyaml
          - types-jsonschema
          - starlette
          - orjson

  - repo: local
    hooks:
      - id: version-sync
        name: package.xml version matches pyproject
        entry: python -m pytest test/test_packaging.py -q
        language: system
        pass_filenames: false
        files: ^(package\.xml|pyproject\.toml|ros2_http_gateway/_version\.py)$
