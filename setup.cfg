# `ros2 run <pkg> <exe>` only looks in lib/<pkg>/, so an ament_python install has to put
# its console script there instead of bin/, which is what makes
# `ros2 run ros2_http_gateway ros2-http-gateway` resolve. This is the one thing setup.cfg
# is for; all other configuration lives in pyproject.toml.
[develop]
script_dir = $base/lib/ros2_http_gateway

[install]
install_scripts = $base/lib/ros2_http_gateway
