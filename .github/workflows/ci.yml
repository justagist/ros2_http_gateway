name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style and types once, not per interpreter: mypy is configured to target the 3.10 floor
  # regardless of the interpreter it runs on, so checking under several buys nothing. The
  # target matters -- it is what makes using something Humble's 3.10 lacks a type error here
  # instead of an ImportError two jobs later.
  lint-type:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: ruff lint
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy --strict ros2_http_gateway

  # Everything that must work without ROS installed. Guards the "pip install on a plain
  # machine" half of the dual-install promise and keeps the rclpy seam honest.
  unit:
    name: unit (py${{ matrix.python }}, no ROS)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: unit tests (no ROS)
        run: pytest -m 'not ros' -q
      - name: cli works without ROS
        run: |
          ros2-http-gateway --help
          ros2-http-gateway --version
          # Must fail with the actionable message, not a traceback.
          if ros2-http-gateway --check examples/dev.yaml 2>err.txt; then
            echo 'expected a non-zero exit without ROS'; exit 1
          fi
          grep -q 'rclpy not found' err.txt

  build-sdist-wheel:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Full suite inside real ROS containers, once per distro. Kilted and newer also run the
  # integration suite under both executors, since EventsExecutor only exists there.
  ros:
    name: ${{ matrix.distro }} (${{ matrix.executor }})
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: humble, executor: multithreaded }
          - { distro: jazzy, executor: multithreaded }
          - { distro: kilted, executor: multithreaded }
          - { distro: kilted, executor: events }
          - { distro: lyrical, executor: multithreaded }
          - { distro: lyrical, executor: events }
          - { distro: rolling, executor: multithreaded }
          - { distro: rolling, executor: events }
    env:
      GATEWAY_TEST_EXECUTOR: ${{ matrix.executor }}
      # Deliberately outside the workspace: the colcon step symlinks the workspace into a
      # scratch overlay, and a venv full of site-packages is both slow to crawl and none of
      # colcon's business.
      VENV: /tmp/gateway-venv
    steps:
      - uses: actions/checkout@v4
      - name: apt deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-venv \
            ros-${{ matrix.distro }}-example-interfaces \
            ros-${{ matrix.distro }}-test-msgs \
            ros-${{ matrix.distro }}-geometry-msgs \
            ros-${{ matrix.distro }}-sensor-msgs \
            ros-${{ matrix.distro }}-std-srvs
      - name: install into a virtualenv
        shell: bash
        run: |
          # Never install into the container's interpreter: it is Debian-managed, so pip
          # either refuses outright (PEP 668) or dies trying to uninstall a distro package
          # that ships no RECORD file, which is what `pytest>=7.4` wanting a newer pluggy
          # triggers.
          #
          # --system-site-packages, because ROS needs more of the distro's Python than
          # setup.bash puts on PYTHONPATH: on Rolling, loading an interface type reaches
          # empy, which lives in /usr/lib/python3/dist-packages. A sealed venv made every
          # ROS test skip instead of run.
          #
          # --ignore-installed is what makes that safe. pip then never tries to uninstall
          # the distro's pytest or pluggy; it just installs our versions into the venv,
          # which precedes dist-packages on sys.path and therefore wins.
          python3 -m venv --system-site-packages "$VENV"
          # Humble ships pip 22, which installs an editable package via `setup.py develop`
          # and so silently ignores the whole [project] table -- including the dev extra,
          # producing "does not provide the extra 'dev'" and no test dependencies at all.
          "$VENV/bin/python" -m pip install --quiet --upgrade pip

          # numpy has to stay on the same major version ROS was built against. Installing
          # numpy 2 on Humble, whose rosidl extension modules are compiled against 1.x,
          # corrupts memory and then segfaults somewhere unrelated -- it surfaced as a crash
          # inside ast.parse while pytest was formatting an unrelated failure. Derived from
          # whatever the distro ships rather than hardcoded per distro.
          major=$("$VENV/bin/python" -c 'import numpy; print(numpy.__version__.split(".")[0])')
          echo "numpy<$((major + 1))" > /tmp/ros-constraints.txt
          echo "constraining numpy: $(cat /tmp/ros-constraints.txt)"

          "$VENV/bin/python" -m pip install --quiet --ignore-installed \
            -c /tmp/ros-constraints.txt -e '.[dev]'
          "$VENV/bin/python" -m pip --version
          "$VENV/bin/python" -c 'import numpy; print("numpy", numpy.__version__)'
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          mkdir -p /tmp/ws/src
          ln -s "$GITHUB_WORKSPACE" /tmp/ws/src/ros2_http_gateway
          cd /tmp/ws
          colcon build --packages-select ros2_http_gateway
          source install/setup.bash
          ros2 run ros2_http_gateway ros2-http-gateway --help
      - name: full test suite
        shell: bash
        env:
          # Turns "rclpy would not import, so everything skipped" from a green run into a
          # collection error. Without it a broken environment is indistinguishable from a
          # deliberately ROS-free one, and this job would pass having tested nothing.
          GATEWAY_REQUIRE_ROS: "1"
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          # Includes the golden-file test, which is the converter drift check.
          "$VENV/bin/python" -m pytest -q
      - name: check example configs
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          "$VENV/bin/ros2-http-gateway" --check examples/dev.yaml
          "$VENV/bin/ros2-http-gateway" --check examples/locked_down.yaml
