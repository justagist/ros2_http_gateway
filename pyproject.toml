[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ros2-http-gateway"
dynamic = ["version", "requires-python"]
description = "Config-driven, authenticated HTTP + SSE gateway for ROS 2"
readme = "README.md"
# requires-python deliberately lives in setup.py, not here. See the comment there:
# colcon's package identification cannot parse the SpecifierSet that setuptools builds
# from a pyproject `requires-python`.
license = { text = "Apache-2.0" }
authors = [{ name = "Saif Sidhik", email = "mail@saifsidhik.page" }]
keywords = ["ros", "ros2", "http", "rest", "gateway", "sse", "openapi", "robotics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Operating System :: POSIX :: Linux",
  "Typing :: Typed",
]

# Every dependency below must carry a justification. Keep this list short.
dependencies = [
  # ASGI toolkit: routing, request/response objects, streaming responses for SSE.
  # Chosen over FastAPI because OpenAPI is generated from our own config model and
  # request validation is done by generated JSON Schemas, so pydantic buys nothing.
  "starlette>=0.37",
  # ASGI server, launched programmatically. The [standard] extra supplies uvloop and
  # httptools, which the hot request path depends on for its latency budget.
  "uvicorn[standard]>=0.29",
  # JSON encoder/decoder. The only mainstream one that serialises numpy arrays natively
  # (OPT_SERIALIZE_NUMPY), which keeps ROS numeric arrays off the .tolist() copy path.
  "orjson>=3.9",
  # Config file parsing. Already present in every ROS 2 environment, so it adds no
  # transitive weight where this package is most often installed.
  "pyyaml>=6.0",
  # Validates the config file against the shipped config.schema.json, so a malformed
  # deployment config fails at startup instead of at the first request.
  "jsonschema>=4.18",
  # rclpy hands numeric arrays over as numpy arrays and every generated message module
  # imports it, so it is already present in any ROS environment. Declared anyway because
  # codegen.py imports it directly, and a pip install into a plain venv would not get it
  # from the Debian python3-numpy package that a ROS install relies on.
  "numpy>=1.22",
]

# rclpy is deliberately NOT listed here. It is not distributable via PyPI; it comes from
# the sourced ROS 2 environment and is declared in package.xml as an <exec_depend>.

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-benchmark>=4.0",
  "httpx>=0.27",
  "types-pyyaml",
  "types-jsonschema",
  "build",
  "tomli>=2.0; python_version < '3.11'",
]
# Deliberately not part of `dev`: CI installs `[dev]` on every leg, and a playwright that is
# installed but browserless would make the `e2e` suite stop skipping and start failing the moment
# anything selected it. Kept separate, `pytest.importorskip` remains a guard that actually works.
# One-time setup: `pip install -e '.[dev,e2e]' && playwright install chromium`.
e2e = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/justagist/ros2_http_gateway"
Repository = "https://github.com/justagist/ros2_http_gateway"
Changelog = "https://github.com/justagist/ros2_http_gateway/blob/main/CHANGELOG.md"

[project.scripts]
# Every name is namespaced. A `gateway` alias would make `ros2 run ros2_http_gateway gateway`
# prettier, and `demo_node` would match the usual ROS convention, but console scripts are
# generated from these entry points for wheel installs too, so each one would claim a generic
# name in ~/.local/bin. setup.cfg's install_scripts redirect only affects the colcon/setup.py
# path, not wheels. Under colcon these land in lib/ros2_http_gateway/, so
# `ros2 run ros2_http_gateway ros2-http-gateway[-demo]` works.
ros2-http-gateway = "ros2_http_gateway.cli:main"
ros2-http-gateway-demo = "ros2_http_gateway.demo_node:main"

[tool.setuptools.dynamic]
# Single source of truth for the version string. package.xml mirrors it and
# test/test_packaging.py fails if the two ever drift.
version = { attr = "ros2_http_gateway._version.__version__" }

[tool.setuptools]
packages = ["ros2_http_gateway"]

[tool.setuptools.package-data]
ros2_http_gateway = [
  "py.typed",
  "config.schema.json",
  # Swagger UI, vendored rather than pulled from a CDN: 1.7MB, licences alongside it.
  "static/swagger/*",
  # The test console: one HTML, one JS, one CSS. No build step, no bundler, no CDN.
  "static/console/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # import sorting
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # bugbear
  "A",   # builtin shadowing
  "C4",  # comprehensions
  "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["ros2_http_gateway"]
known-local-folder = ["ros_fixtures"]

[tool.ruff.lint.per-file-ignores]
# Generated converter source is assembled from string fragments; long lines are fine.
"ros2_http_gateway/codegen.py" = ["E501"]

[tool.mypy]
# The real floor, so that using something Humble's 3.10 does not have is a type error here
# rather than an ImportError in CI. numpy's own stubs cannot be parsed under this target
# (they use PEP 695 syntax), so typings/numpy shadows them; see the note in that file.
python_version = "3.10"
mypy_path = "typings"
strict = true
warn_unreachable = true
# rclpy and the ROS interface packages ship no type information. `follow_imports` matters as much as
# `ignore_missing_imports`: CI lints without ROS installed, but a contributor with it sourced would
# otherwise have mypy analyse the real untyped modules and report errors CI never sees.
[[tool.mypy.overrides]]
module = [
  "rclpy.*",
  "rosidl_runtime_py.*",
  "rosidl_parser.*",
  "action_msgs.*",
  "builtin_interfaces.*",
  "unique_identifier_msgs.*",
  # The demo node's own interface packages, imported lazily inside it.
  "example_interfaces.*",
  "std_srvs.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
# ROS ships launch_testing pytest plugins whose hookimpls predate pytest 8, so merely
# having them importable breaks collection. Nothing here uses them: the integration tests
# spin up an rclpy context directly.
# `not e2e` by default: that suite downloads a browser, starts two ROS processes and takes about
# a minute, so it is opt-in with `pytest -m e2e` and stays outside the CI gate.
addopts = "-p no:launch_testing -p no:launch_ros -m 'not e2e'"
markers = [
  "ros: requires a sourced ROS 2 environment (skipped on plain Python CI)",
  "bench: performance benchmark, informational unless asserted",
  "e2e: drives the console in a real browser; needs playwright and chromium",
]
